name: Deploy Torbox Companion

on:
workflow_dispatch:
push:
branches:
- main

jobs:
deploy:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install flyctl
    uses: superfly/flyctl-actions/setup-flyctl@master

  - name: Deploy to Fly.io
    run: |
      flyctl deploy \
        --app tbc-ggy9-q \
        --image ghcr.io/crazycacti/torbox-companion:latest \
        --config fly.toml
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
